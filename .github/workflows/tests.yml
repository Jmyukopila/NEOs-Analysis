name: tests

# El pipeline principal ya no se ejecuta en CI: descarga 59 MB de la API de JPL y
# tarda minutos. Lo que se comprueba aqui es lo que se puede comprobar sin red, que
# es justamente donde se han producido los fallos silenciosos: una etiqueta
# malmapeada, un `KeyError` en el resolutor de rutas, un caracter corrupto.
#
# Los tests que necesitan el snapshot lo saltan si no esta (`pytest.skip`), de modo
# que este workflow pasa sin el. El pipeline completo se ejecuta localmente contra
# el snapshot versionado.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows y macOS/Linux: el proyecto sufrio dos veces de problemas que solo
        # aparecian en un sistema. El primero fue la codificacion: los CSV se
        # leian con cp1252 y los acentos de las columnas se rompian. El segundo fue
        # `os.path.join` con rutas de Windows montadas en Linux.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Comprobar que el paquete importa
        run: python -c "import neos; print(len(neos.__all__), 'simbolos exportados')"

      - name: Comprobar sintaxis de todos los scripts
        # Script externo y no un heredoc: un heredoc de bash no se ejecuta en el
        # runner de Windows (PowerShell), y el job pasaria a comprobarlo en un
        # unico sistema operativo justo cuando se quiere comprobar en los dos.
        run: python scripts/comprobar_sintaxis.py

      - name: Tests
        run: python -m pytest -v --tb=short

      - name: El pipeline expone las opciones de la CLI
        run: python scripts/pipeline_moid_pha.py --help
